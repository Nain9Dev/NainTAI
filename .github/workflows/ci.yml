name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend-test:
    name: Backend Build & Unit Tests (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore src/Oposiciones.sln

      - name: Build in Release
        run: dotnet build src/Oposiciones.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test src/Oposiciones.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results
          if-no-files-found: warn

  frontend-build:
    name: Frontend Typecheck & Build (React 19 / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "Tai.Client/package-lock.json"

      - name: Install dependencies
        working-directory: Tai.Client
        run: npm ci

      - name: Typecheck and build SPA
        working-directory: Tai.Client
        run: npm run build
