services:
  db:
    image: postgres:16-alpine
    container_name: oposiciones-db
    environment:
      POSTGRES_USER: tai_user
      POSTGRES_PASSWORD: tai_password
      POSTGRES_DB: oposiciones_tai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tai_user -d oposiciones_tai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oposiciones-api
    environment:
      PORT: 8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=oposiciones_tai;Username=tai_user;Password=tai_password"
      Jwt__Key: "local-dev-insecure-key-32-chars-long-minimum!"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
